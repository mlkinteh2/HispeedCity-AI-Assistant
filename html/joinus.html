<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Join Us - Hispeedcity Careers</title>

<!-- CSS -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<link href="css/bootstrap-icons.css" rel="stylesheet">
<link href="css/templatemo-topic-listing.css" rel="stylesheet">

<style>
.job-grid{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  justify-content:center;
}

.job-card{
  width:320px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  transition:0.3s;
}
.job-card:hover{
  transform:translateY(-5px);
}

.job-cover{
  width:100%;
  height:160px;
  object-fit:cover;
}

.job-body{
  padding:15px;
}

.job-title{
  font-weight:700;
  color:var(--primary-color);
}

.job-meta{
  color:#777;
  font-size:14px;
}

.job-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-top:1px solid #eee;
}
</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Open Positions</h2>

<div class="job-grid">

<!-- NEW Internship -->
<div class="job-card">
<img src="images/jrwm_11.jpg" class="job-cover">
<div class="job-body">
<div class="job-title">IT Internship</div>
<p class="job-meta">(Software, App, UX/UI, Network, Cloud) (KL & JB)</p>
</div>
<div class="job-footer">
<span class="badge bg-success">Open</span>
<a href="https://my.jobstreet.com/job/91346160?ref=direct-share-hirer-jobs-list" class="btn custom-btn btn-sm" target="_blank">Apply</a>
</div>
</div>

<!-- NEW Co-Founder -->
<div class="job-card">
<img src="images/jrwm10.jpg" class="job-cover">
<div class="job-body">
<div class="job-title">Management</div>
<p class="job-meta">Leadership · Strategy · Startup Growth</p>
</div>
<div class="job-footer">
<span class="badge bg-warning text-dark">High Impact</span>
<a href="https://my.jobstreet.com/job/91209974?ref=direct-share-hirer-jobs-list" class="btn custom-btn btn-sm" target="_blank">Apply</a>
</div>
</div>

<!-- NEW Car Park -->
<div class="job-card">
<img src="images/jrwm_3.png" class="job-cover">
<div class="job-body">
<div class="job-title">Operations</div>
<p class="job-meta">JB or KL · Operations & Management</p>
</div>
<div class="job-footer">
<span class="badge bg-success">Open</span>
<a href="https://my.jobstreet.com/job/91511887?ref=direct-share-hirer-jobs-list " class="btn custom-btn btn-sm" target="_blank">Apply</a>
</div>
</div>

</div>

</div>

<!-- JS -->
<script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
