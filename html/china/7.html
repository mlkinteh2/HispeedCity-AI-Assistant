<script>
	$(function(){
		function footerPosition(){
			$("footer").removeClass("fixed-bottom");
			var contentHeight = document.body.scrollHeight,//网页正文全文高度
				winHeight = window.innerHeight;//可视窗口高度，不包括浏览器顶部工具栏
			if(!(contentHeight > winHeight)){
				//当网页正文高度小于可视窗口高度时，为footer添加类fixed-bottom
				$("footer").addClass("fixed-bottom");
			} else {
				$("footer").removeClass("fixed-bottom");
			}
		}
		footerPosition();
		$(window).resize(footerPosition);
	});
	
	$(".header_zhong ul li").click(function(){
			$(this).addClass("header_dianji_in");
			$(this).siblings().removeClass("header_dianji_in");
		  });
		  		 
	$(".ggtc_bodyer_b_header ul li").click(function(){
			$(this).addClass("ggtc_bodyer_b_header_ul_li_in");
			$(this).siblings().removeClass("ggtc_bodyer_b_header_ul_li_in");
		  }); 
</script>
